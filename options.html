<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Counter Pro Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: auto;
      min-height: 100vh;
    }

    .options-shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px;
    }

    .settings-panel {
      display: grid;
      gap: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      background: var(--panel);
      color: var(--text);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #saveStatus {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="options-shell">
    <header class="topbar">
      <div>
        <h1>Character Counter Pro Settings</h1>
        <p>Preferences sync with Chrome where suitable.</p>
      </div>
    </header>

    <form id="settingsForm" class="settings-panel">
      <div class="field">
        <label for="defaultPreset">Default highlighted limit</label>
        <select id="defaultPreset" name="defaultPreset"></select>
      </div>

      <div class="field">
        <label for="readingWpm">Reading speed, words per minute</label>
        <input id="readingWpm" name="readingWpm" type="number" min="50" max="800" step="5">
      </div>

      <div class="field">
        <label for="speakingWpm">Speaking speed, words per minute</label>
        <input id="speakingWpm" name="speakingWpm" type="number" min="50" max="400" step="5">
      </div>

      <div class="field">
        <div class="toggle-row">
          <input id="rememberDraft" name="rememberDraft" type="checkbox">
          <label for="rememberDraft">Remember my draft between sessions</label>
        </div>
      </div>

      <div class="field">
        <label for="theme">Theme</label>
        <select id="theme" name="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit">Save settings</button>
        <span id="saveStatus" aria-live="polite"></span>
      </div>
    </form>
  </main>

  <script src="shared/count.js"></script>
  <script src="options.js"></script>
</body>
</html>
